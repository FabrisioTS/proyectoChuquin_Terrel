<!-- MODAL DE DOCUMENTOS LEGALES -->
<div class="fixed inset-0 z-[100] flex items-end justify-center p-3 sm:items-center sm:p-6" role="dialog"
    aria-modal="true" aria-labelledby="titulo-legal">
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm" (click)="cerrar.emit()"></div>

    <div
        class="relative flex max-h-[92vh] w-full max-w-3xl flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl">
        <header class="flex items-start justify-between gap-4 border-b border-slate-100 px-5 py-4 sm:px-7">
            <div>
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-brand-700">Clínica Pariona</span>
                <h2 id="titulo-legal" class="mt-1 text-lg font-extrabold text-slate-900 sm:text-xl">{{ titulo() }}
                </h2>
                <p class="mt-1 text-[11px] text-slate-500">{{ subtitulo() }}</p>
            </div>
            <button type="button" (click)="cerrar.emit()" [attr.aria-label]="'Cerrar ' + titulo()"
                class="rounded-xl bg-slate-100 p-2 text-slate-500 transition-colors hover:bg-slate-200 hover:text-slate-800">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </header>

        <div class="min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-7">
            @for (seccion of contenido(); track seccion.titulo) {
            <section class="mb-5 last:mb-0">
                <h3 class="text-sm font-extrabold text-slate-900">{{ seccion.titulo }}</h3>
                @for (parrafo of seccion.parrafos; track parrafo) {
                <p class="mt-1.5 text-[11px] leading-relaxed text-slate-600">{{ parrafo }}</p>
                }
            </section>
            }
        </div>

        <footer class="flex items-center justify-between gap-3 border-t border-slate-100 bg-slate-50/80 px-5 py-4 sm:px-7">
            <p class="hidden text-[10px] text-slate-400 sm:block">Última actualización: enero de 2026</p>
            <button type="button" (click)="cerrar.emit()"
                class="rounded-xl bg-brand-600 px-5 py-2.5 text-xs font-bold text-white shadow-md shadow-brand-600/20 transition-colors hover:bg-brand-700">
                Entendido
            </button>
        </footer>
    </div>
</div>
