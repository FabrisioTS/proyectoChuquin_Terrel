<!-- PREGUNTAS FRECUENTES -->
<section id="faq" class="py-20 bg-white">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="text-center max-w-2xl mx-auto mb-12 space-y-3">
            <span
                class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-50 border border-brand-100 text-brand-700 text-xs font-bold uppercase tracking-wider">
                <span class="icono-material" aria-hidden="true">help</span> Preguntas Frecuentes
            </span>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                Resolvemos tus dudas antes de la visita
            </h2>
            <p class="text-slate-600 text-sm">
                Si no encuentras tu respuesta, escríbenos por WhatsApp o completa el formulario de contacto.
            </p>
        </div>

        <div class="space-y-3">
            @for (pregunta of preguntasFrecuentes; track pregunta.pregunta) {
            <details
                class="group rounded-2xl border border-slate-200 bg-slate-50/60 transition-colors open:border-brand-200 open:bg-white">
                <summary
                    class="flex list-none cursor-pointer items-center justify-between gap-4 p-5 text-xs font-bold text-slate-800 sm:text-sm [&::-webkit-details-marker]:hidden">
                    <span>{{ pregunta.pregunta }}</span>
                    <span
                        class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-white text-slate-500 transition-transform duration-300 group-open:rotate-180 group-open:bg-brand-600 group-open:text-white">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 9l-7 7-7-7" />
                        </svg>
                    </span>
                </summary>
                <p class="px-5 pb-5 text-xs leading-relaxed text-slate-600">{{ pregunta.respuesta }}</p>
            </details>
            }
        </div>

    </div>
</section>
